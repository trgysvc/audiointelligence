name: AudioIntelligence Swift CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build & Scientific Validation
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Select Xcode (Swift 6.3 toolchain)
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Environment Audit
        run: |
          swift --version
          xcodebuild -version
      
      - name: Resolve Dependencies
        run: swift package resolve
      
      - name: Build SDK (Release Mode)
        run: swift build -c release -v
        
      - name: Run Scientific Validation Suite
        run: swift test --filter ScientificValidationTests -v
        
      - name: Run DSP Ground Truth Suite
        run: swift test --filter DSPGroundTruthTests -v

      - name: Archive Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: .build/*.log
          if-no-files-found: ignore
